<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>tauction</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='50' dy='.36em' text-anchor='middle' font-size='90' font-family='Georgia,serif' fill='%235b5bd6'%3E%CF%84%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<!-- ==================== GITHUB PAGES 404 HACK ====================
     index.html and 404.html are EXACT COPIES of each other, enforced
     by a qual. GitHub Pages serves 404.html for every path that isn't
     a real file, so shipping the whole app as the "404 page" means
     any /slug URL loads the app directly: no redirects, no dead ends;
     the URL bar itself names the auction.
     EDIT index.html, NEVER 404.html, then run:  npm run sync-404
     ================================================================ -->
</head>
<body>
<main>
  <header>
  </header>

  <div id="banner" hidden></div>

  <section class="card">
    <div class="field">
      <div class="label-row"><label for="aname">auction</label><span
        class="tip" tabindex="0"
        data-tip="Name of this auction, or just edit the URL">?</span></div>
      <input id="aname" autocomplete="off" autocapitalize="off"
             spellcheck="false" maxlength="40" placeholder="tau">
    </div>

    <form id="bid-form">
      <div class="field">
        <label for="uname">you</label>
        <div class="at-wrap"><span class="at">@</span><input id="uname"
             autocomplete="off" autocapitalize="off" spellcheck="false"
             maxlength="30" placeholder=""></div>
      </div>

      <div class="field">
        <div class="label-row"><label for="bid">bid</label><span
          class="tip" tabindex="0"
          data-tip="You're free to change and resubmit your bid until the last bidder submits theirs">?</span></div>
        <input id="bid" maxlength="80" autocomplete="off"
               placeholder="">
      </div>

      <button id="place" type="submit">submit</button>
    </form>
  </section>

  <section class="card" id="settings">
    <div class="radio-row">
      <input type="radio" id="mode-count" name="mode" checked>
      <label for="mode-count" class="radio-label">
        Reveal after <input type="number" id="n" min="1" value="2"> people bid
      </label>
    </div>
    <div class="radio-row">
      <input type="radio" id="mode-roster" name="mode">
      <label for="mode-roster" class="radio-label">Reveal after these people bid:</label>
    </div>
    <div class="roster-box">
      <div id="chips" class="chips"></div>
      <div class="at-wrap"><span class="at">@</span><input id="roster-input"
           autocomplete="off" autocapitalize="off" spellcheck="false"
           maxlength="30" placeholder=""></div>
    </div>
  </section>

  <section id="status" class="card" hidden></section>

  <footer>
    <a href="https://github.com/dreeves/tauction">github.com/dreeves/tauction</a>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
